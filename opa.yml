groups: - name: tls-certificate-revocation interval: 1m rules: # Exit code 1 means that a cryptographically verified OCSP response or # a signed, current CRL reported the leaf certificate as revoked. - alert: TLSCertificateRevoked expr: script_exit_code{script="tls_revocation"} == 1 labels: severity: disaster project: some_project annotations: summary: "TLS-сертификат отозван: {{ $labels.instance }}" description: >- Проверка получила подтверждённый статус REVOKED через OCSP или CRL. target={{ $labels.instance }}, project={{ $labels.project }}, env={{ $labels.env }}. Сертификат необходимо срочно заменить. # Exit code 2 means that the status could not be determined. This can # happen when the target is down, no certificate was returned, or all # OCSP/CRL checks failed. A delay avoids alerts on short outages. - alert: TLSCertificateRevocationUnknown expr: script_exit_code{script="tls_revocation"} == 2 for: 10m labels: severity: warning project: some_project annotations: summary: "Не удалось проверить отзыв сертификата: {{ $labels.instance }}" description: >- Статус отзыва остаётся UNKNOWN более 10 минут. target={{ $labels.instance }}, project={{ $labels.project }}, env={{ $labels.env }}. Проверьте доступность target и журнал script-exporter: journalctl -u script-exporter. # -1 normally means that script_exporter could not obtain a normal exit # code, for example because the process was killed by its timeout. - alert: TLSCertificateRevocationCheckAbnormalExit expr: >- (script_exit_code{script="tls_revocation"} < 0) or (script_exit_code{script="tls_revocation"} > 2) for: 10m labels: severity: warning project: some_project annotations: summary: "Аварийное завершение проверки сертификата: {{ $labels.instance }}" description: >- Скрипт проверки завершился с неожиданным кодом {{ $value }}. target={{ $labels.instance }}, project={{ $labels.project }}, env={{ $labels.env }}. Возможны таймаут, принудительное завершение процесса или внутренняя ошибка.
